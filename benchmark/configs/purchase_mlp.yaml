benchmark:
  seeds: [0, 1, 2]

data:
  dataset: purchase
  num_classes: 100
  input_dim: 600
  splits:
    target_train: 7000
    target_val: 1500
    shadow_train: 3000
    shadow_test: 3000
    auxiliary: 1700
    target_member_eval: 3000   # ⊂ target_train
    target_nonmember: 3000

reference:
  pool_from: [shadow_train, shadow_test, auxiliary]  # 7,700
  subset_ratio: 0.5          # 每个 ref 训练 3,850
  num_models: 4

population:
  from: reference_pool
  size: 700

rmia:
  gamma: 2                   # 论文 B.4
  offline_a: 0.2             # 论文 Purchase-100 值
  confidence: softmax

shadow:
  architecture: same_as_target

attack:
  attacks: [LossAttack, CorrectnessAttack, ConfidenceAttack, EntropyAttack, ModifiedEntropyAttack, ShadowBasedAttack, LiRAAttack, RMIAAttack, QMIAAttack, RAPIDAttack]
  accuracy_threshold: shadow_calibrated

model:
  arch: mlp_512_256_128_64
  optimizer: Adam
  lr: 0.001
  batch_size: 128
  epochs: 50
  weight_decay: 0

defense:
  methods: [DPSGD, RelaxLoss, HAMP, EarlyStop, AdvReg, MemGuard, Mixup, LabelSmoothing]
  dp_sgd_on_cifar: groupnorm_variant

defense_attacks: [LossAttack, ShadowBasedAttack, LiRAAttack, RMIAAttack]
defense_attacks_optional: [QMIAAttack]

metrics:
  utility: [accuracy]
  privacy: [auroc, attack_accuracy, tpr_at_1pct_fpr]
