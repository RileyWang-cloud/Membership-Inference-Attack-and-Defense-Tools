# 4090-side benchmark config — verbatim per plan §17 (B-C2-B CIFAR-10/ResNet18).
benchmark:
  seeds: [0, 1, 2]

data:
  dataset: cifar10
  loader: torchvision          # 自动下载
  splits:
    target_train: 20000
    target_val: 5000
    shadow_train: 10000
    shadow_test: 10000
    auxiliary: 5000
    target_member_eval: 10000   # ⊂ target_train
    target_nonmember: 10000     # 官方测试集
  reserve: 0

reference:
  pool_from: [shadow_train, shadow_test, auxiliary]  # 25,000（攻击侧一半数据）
  subset_ratio: 0.5                        # 每个 ref 训练 pool 的 50% → 12,500
  num_models: 4                            # RMIA 论文低预算设定；{1,2,4} 免费消融
  reuse_models: true

population:
  from: reference_pool
  size: 2500                               # 论文 Table 11：2500 个 z 已接近饱和

rmia:
  gamma: 2                                 # 论文 B.4
  offline_a: 0.3                           # 论文 B.2.2（图像取 CIFAR-10 值）
  confidence: softmax                      # 可选 sm_taylor_softmax: {m: 0.6, n: 4, T: 2}

shadow:
  reuse_models: true
  architecture: same_as_target

attack:
  member_nonmember_ratio: 1.0
  attacks:
    - LossAttack
    - CorrectnessAttack
    - ConfidenceAttack
    - EntropyAttack
    - ModifiedEntropyAttack
    - ShadowBasedAttack
    - LiRAAttack
    - RMIAAttack
    - QMIAAttack
    - RAPIDAttack
  accuracy_threshold: shadow_calibrated   # §14.1

model:
  arch: resnet18_cifar
  optimizer: SGD
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  batch_size: 128
  epochs: 100
  scheduler: {name: MultiStepLR, milestones: [50, 75], gamma: 0.1}

defense:
  methods: [DPSGD, RelaxLoss, HAMP, EarlyStop, AdvReg, MemGuard, Mixup, LabelSmoothing]
  dp_sgd_on_cifar: groupnorm_variant     # §10.4

defense_attacks: [LossAttack, ShadowBasedAttack, LiRAAttack, RMIAAttack]
defense_attacks_optional: [QMIAAttack]   # 双卡预算充足，默认执行（§12 / §23.5）

metrics:
  utility: [accuracy]
  privacy: [auroc, attack_accuracy, tpr_at_1pct_fpr, tpr_at_0_1pct_fpr, tpr_at_0pct_fpr]
